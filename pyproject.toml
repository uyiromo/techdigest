[project]
name = "techdigest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "feedparser>=6.0.12",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "openai>=2.21.0",
    "outlines>=1.3.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "readability-lxml>=0.8.4.1",
    "requests>=2.32.5",
    "slack-bolt>=1.27.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [
    "**/.git",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.venv",
    "**/.vscode/",
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
    "**/site-packages"
]


[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
]
fix = true
indent-width = 4
line-length = 120
show-fixes = true

[tool.ruff.format]
docstring-code-format   = true
line-ending             = "lf"
quote-style             = "single"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "W"]
fixable = ["ALL"]

[tool.ruff.isort]
section-order = ["future", "standard-library", "first-party", "local-folder", "third-party"]
